<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: "Inter", sans-serif; color: #eef2ff;
            background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.22), transparent 32%),
                        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.18), transparent 30%), #0b1020;
            display: flex; align-items: center; justify-content: center; padding: 32px 18px;
        }
        .card {
            width: min(520px, 100%); padding: 40px; border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px; background: rgba(17, 24, 39, 0.78); box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(18px); text-align: center;
        }
        h2 { font-size: 1.75rem; margin: 0 0 28px; letter-spacing: -0.04em; text-transform: uppercase; font-weight: 800; }
        
        /* Form group styling */
        .input-group { text-align: left; margin-bottom: 16px; position: relative; }
        .input-label {
            display: block; margin-bottom: 6px; color: #7f8ba3; font-size: 0.72rem;
            font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
        }
        
        input[type="text"], input[type="number"] {
            width: 100%; height: 50px; padding: 0 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.09);
            color: #fff; font-family: "Inter", sans-serif; font-size: 0.9rem; outline: none;
            transition: all .18s ease;
        }

        /* Hide default browser up/down arrows for number inputs */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            padding-right: 48px; /* Room for custom spinner buttons */
        }

        input[type="text"]:focus, input[type="number"]:focus {
            background: rgba(255, 255, 255, 0.07); border-color: #818cf8;
            box-shadow: 0 0 12px rgba(129, 140, 248, 0.25);
        }

        /* Disappearing placeholder effect */
        input::placeholder { color: #7f8ba3; font-weight: 700; letter-spacing: 0.05em; }
        input:focus::placeholder { color: transparent; }

        /* Custom Number Spinners Controls */
        .number-controls {
            position: absolute; right: 10px; bottom: 6px; display: flex;
            flex-direction: column; gap: 2px;
        }
        .spin-btn {
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #7f8ba3; border-radius: 6px; width: 26px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0; transition: all 0.15s ease;
        }
        .spin-btn:hover {
            background: rgba(255, 255, 255, 0.15); color: #fff; border-color: rgba(255, 255, 255, 0.2);
        }
        .spin-btn svg { width: 10px; height: 10px; fill: currentColor; }

        /* Actions grid matching system style */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 24px; }
        .box {
            display: flex; align-items: center; justify-content: center; height: 60px; width: 100%;
            border-radius: 16px; text-decoration: none; background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07); color: #f8fafc; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
            transition: all .18s ease;
        }
        .box:hover {
            background: #f97316; border-color: #fb923c; color: #fff;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4); transform: translateY(-2px);
        }
        
        .box-danger:hover {
            background: #ef4444; border-color: #f87171; color: #fff;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Edit Data</h2>

    <form th:action="@{/student/update_info}" method="post" th:object="${user_data}">
        
        <div class="input-group">
            <label class="input-label">Full Name</label>
            <input type="text" th:field="*{fullName}" placeholder="FULL NAME" required />
        </div>

        <div class="input-group">
            <label class="input-label">Years of Studies</label>
            <input type="number" id="yearsInput" th:field="*{yearsOfStudies}" placeholder="YEARS OF STUDIES" min="0" required />
            <div class="number-controls">
                <button type="button" class="spin-btn" onclick="stepNumber('yearsInput', 1)">
                    <svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12z"/></svg>
                </button>
                <button type="button" class="spin-btn" onclick="stepNumber('yearsInput', -1)">
                    <svg viewBox="0 0 24 24"><path d="M12 16l6-6H6z"/></svg>
                </button>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Current Average Grade</label>
            <input type="number" id="gradeInput" step="0.01" th:field="*{currentAvgGrade}" placeholder="AVERAGE GRADE" min="0" max="10" required />
            <div class="number-controls">
                <button type="button" class="spin-btn" onclick="stepNumber('gradeInput', 0.1)">
                    <svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12z"/></svg>
                </button>
                <button type="button" class="spin-btn" onclick="stepNumber('gradeInput', -0.1)">
                    <svg viewBox="0 0 24 24"><path d="M12 16l6-6H6z"/></svg>
                </button>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Remaining Courses</label>
            <input type="number" id="coursesInput" th:field="*{coursesRemaining}" placeholder="REMAINING COURSES" min="0" required />
            <div class="number-controls">
                <button type="button" class="spin-btn" onclick="stepNumber('coursesInput', 1)">
                    <svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12z"/></svg>
                </button>
                <button type="button" class="spin-btn" onclick="stepNumber('coursesInput', -1)">
                    <svg viewBox="0 0 24 24"><path d="M12 16l6-6H6z"/></svg>
                </button>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="box">Confirm</button>
            <a th:href="@{/student/dashboard}" class="box box-danger">Cancel</a>
        </div>
        
    </form>
</div>

<script>
    function stepNumber(inputId, step) {
        const input = document.getElementById(inputId);
        let val = parseFloat(input.value) || 0;
        let min = input.hasAttribute('min') ? parseFloat(input.getAttribute('min')) : -Infinity;
        let max = input.hasAttribute('max') ? parseFloat(input.getAttribute('max')) : Infinity;
        
        let newVal = val + step;
        
        // Handle floating point rounding precision issues (e.g. 8.100000000000001)
        if (step % 1 !== 0) {
            newVal = Math.round(newVal * 100) / 100;
        }

        if (newVal >= min && newVal <= max) {
            input.value = newVal;
        }
    }
</script>

</body>
</html>
