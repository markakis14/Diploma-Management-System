<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thesis Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: "Inter", sans-serif; color: #eef2ff;
            background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.22), transparent 32%),
                        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.18), transparent 30%), #0b1020;
            display: flex; align-items: center; justify-content: center; padding: 32px 18px;
        }
        .card {
            width: min(640px, 100%); padding: 40px; border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px; background: rgba(17, 24, 39, 0.78); box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(18px); text-align: left;
        }
        h2 { font-size: 1.75rem; margin: 0 0 24px; letter-spacing: -0.03em; font-weight: 800; text-align: center; color: #fff; }
        
        /* Information Sections */
        .info-section {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        .section-label {
            display: block; color: #7f8ba3; font-size: 0.72rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px;
        }
        .section-content {
            font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; font-weight: 400; margin: 0;
        }
        .supervisor-name {
            color: #818cf8; font-weight: 700; font-size: 1.05rem; margin: 0;
        }

        /* Footer Cancel Action */
        .actions { margin-top: 28px; }
        .box-danger {
            display: flex; align-items: center; justify-content: center; height: 50px; width: 100%;
            border-radius: 16px; text-decoration: none; background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07); color: #f8fafc; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
            transition: all .18s ease;
        }
        .box-danger:hover {
            background: #ef4444; border-color: #f87171; color: #fff;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div class="card">
    <h2 th:text="${thesis.title}">Thesis Title</h2>

    <div class="info-section">
        <span class="section-label">Supervisor</span>
        <p class="supervisor-name" th:text="${profName}">Professor Name</p>
    </div>

    <div class="info-section">
        <span class="section-label">Description</span>
        <p class="section-content" th:text="${thesis.description}">Thesis description text goes here...</p>
    </div>

    <div class="actions">
        <a th:href="@{/student/thesis_list}" class="box-danger">Cancel</a>
    </div>
</div>

</body>
</html>
