<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: "Inter", sans-serif; color: #eef2ff;
            background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.22), transparent 32%),
                        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.18), transparent 30%), #0b1020;
            display: flex; align-items: center; justify-content: center; padding: 32px 18px;
        }
        .card {
            width: min(480px, 100%); padding: 40px; border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px; background: rgba(17, 24, 39, 0.78); box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(18px); text-align: center;
        }
        h3 { font-size: 2rem; margin: 0 0 28px; letter-spacing: -0.04em; text-transform: uppercase; font-weight: 800; }
        
        /* Input wrappers & positioning */
        .input-container { position: relative; width: 100%; margin-bottom: 16px; }
        
        input[type="text"], input[type="password"] {
            width: 100%; height: 50px; padding: 0 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.09);
            color: #fff; font-family: "Inter", sans-serif; font-size: 0.9rem; outline: none;
        }
        
        /* Password padding to prevent text overlapping eye icon */
        .password-field { padding-right: 48px !important; }

        /* Placeholders vanish immediately when focused/typing */
        input::placeholder { color: #7f8ba3; font-weight: 700; letter-spacing: 0.05em; transition: color 0.1s ease; }
        input:focus::placeholder { color: transparent; }

        /* Eye toggle icon */
        .toggle-password {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center; color: #7f8ba3;
        }
        .toggle-password:hover { color: #f8fafc; }
        .toggle-password svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
        .box {
            display: flex; align-items: center; justify-content: center; height: 60px; width: 100%;
            border-radius: 16px; text-decoration: none; background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07); color: #f8fafc; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
            transition: all .18s ease;
        }
        .box:hover {
            background: #f97316; border-color: #fb923c; color: #fff;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4); transform: translateY(-2px);
        }
        
        /* Error box alert styling */
        .error { 
            margin-top: 18px; 
            padding: 12px 16px; 
            border-radius: 12px; 
            background: rgba(239, 68, 68, 0.12); 
            border: 1px solid rgba(239, 68, 68, 0.25); 
            color: #fca5a5; 
            font-size: 0.85rem; 
            font-weight: 600; 
        }
        .error p { margin: 0; }
        
        .success {
            margin-top: 18px;
            display: block;
            color: #86efac;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="card">
    <form th:action="@{/login}" method="POST">
        <h3>Login</h3>
        
        <div class="input-container">
            <input type="text" name="username" placeholder="USER NAME" required />
        </div>

        <div class="input-container">
            <input type="password" id="passwordInput" class="password-field" name="password" placeholder="PASSWORD" required />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                <!-- Eye Icon (Shown when masked) -->
                <svg id="eyeIcon" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- Eye Off / Blind Icon (Hidden by default) -->
                <svg id="eyeOffIcon" viewBox="0 0 24 24" style="display: none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>
        
        <div class="actions">
            <button type="submit" class="box">Login</button>
            <a th:href="@{/register}" class="box">Register</a>
        </div>
        
        <!-- Only renders when URL has ?error parameter -->
        <div th:if="${param.error != null}" class="error">
            <p>Username or Password is invalid.</p>
        </div>

        <span th:if="${successMessage != null}" class="success" th:utext="${successMessage}"></span>
    </form>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
        } else {
            passwordInput.type = 'password';
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
        }
    }
</script>

</body>
</html>
