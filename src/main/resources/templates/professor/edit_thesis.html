<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Thesis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: "Inter", sans-serif; color: #eef2ff;
            background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.22), transparent 32%),
                        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.18), transparent 30%), #0b1020;
            display: flex; align-items: center; justify-content: center; padding: 32px 18px;
        }
        .card {
            width: min(780px, 100%); padding: 40px; border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px; background: rgba(17, 24, 39, 0.78); box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(18px); text-align: left;
        }
        h2 { font-size: 1.75rem; margin: 0 0 24px; letter-spacing: -0.04em; text-transform: uppercase; font-weight: 800; text-align: center; }
        h5 { font-size: 1.1rem; margin: 24px 0 14px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
        
        .section-label {
            display: block; color: #7f8ba3; font-size: 0.72rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
        }

        /* Form input styling */
        .input-group { margin-bottom: 16px; }
        input[type="text"], textarea {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.09);
            color: #fff; font-family: "Inter", sans-serif; font-size: 0.9rem; outline: none;
            transition: all .18s ease;
        }
        textarea { resize: vertical; min-height: 90px; }
        input[type="text"]:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.07); border-color: #818cf8;
            box-shadow: 0 0 12px rgba(129, 140, 248, 0.25);
        }
        input::placeholder, textarea::placeholder { color: #7f8ba3; font-weight: 700; letter-spacing: 0.05em; }
        input:focus::placeholder, textarea:focus::placeholder { color: transparent; }

        /* Glassmorphic Table Container */
        .table-container {
            width: 100%; overflow-x: auto; margin-bottom: 24px;
            border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        th {
            background: rgba(255, 255, 255, 0.05); color: #7f8ba3; font-size: 0.75rem;
            font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        td {
            padding: 14px 16px; font-size: 0.9rem; color: #e2e8f0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04); vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }

        /* Action Buttons */
        .action-cell { display: flex; justify-content: flex-end; }
        .btn-action {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 14px; border-radius: 10px; text-decoration: none;
            font-weight: 700; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05);
            color: #f8fafc; transition: all 0.18s ease; cursor: pointer;
        }
        .btn-action:hover {
            background: #f97316; border-color: #fb923c; color: #fff;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.35); transform: translateY(-1px);
        }

        /* Auto-assignment Grid */
        .auto-assign-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 24px;
        }

        /* Bottom Control Grid */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 24px; }
        .box {
            display: flex; align-items: center; justify-content: center; height: 50px; width: 100%;
            border-radius: 16px; text-decoration: none; background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07); color: #f8fafc; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
            transition: all .18s ease;
        }
        .box:hover {
            background: #f97316; border-color: #fb923c; color: #fff;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4); transform: translateY(-2px);
        }
        .box-danger:hover {
            background: #ef4444; border-color: #f87171; color: #fff;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); transform: translateY(-2px);
        }

        .divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 24px 0; border: none; }
    </style>
</head>

<body>

<div class="card">
    <h2>Manage Thesis</h2>

    <form action="#" th:action="@{/professor/save}" th:object="${thesis}" method="POST">
        <!-- Hidden field for update ID -->
        <input type="hidden" th:field="*{id}" />

        <div class="input-group">
            <span class="section-label">Title</span>
            <input type="text" th:field="*{title}" placeholder="THESIS TITLE" required />
        </div>

        <div class="input-group">
            <span class="section-label">Description</span>
            <textarea th:field="*{description}" placeholder="THESIS DESCRIPTION" rows="3" required></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="box">Save Changes</button>
            <a th:href="@{/professor/thesis_list}" class="box box-danger">Cancel</a>
        </div>
    </form>

    <hr class="divider">

    <h5>Applicants</h5>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Average Grade</th>
                    <th>Remaining Courses</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ap : ${thesis.applications}">
                    <td th:text="${ap.applicant.fullName}">Student Name</td>
                    <td th:text="${ap.applicant.currentAvgGrade}">8.5</td>
                    <td th:text="${ap.applicant.coursesRemaining}">2</td>
                    <td>
                        <div class="action-cell">
                            <a th:href="@{/professor/assgn_student(thesisId=${thesis.id}, studentId=${ap.applicant.id})}"
                               class="btn-action">
                                Assign
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <span class="section-label">Auto-Assign Strategy</span>
    <div class="auto-assign-grid">
        <a th:href="@{/professor/assgn_grade(thesisId=${thesis.id})}" class="btn-action">
            Highest Avg Grade
        </a>
        <a th:href="@{/professor/assgn_courses(thesisId=${thesis.id})}" class="btn-action">
            Fewest Courses Left
        </a>
        <a th:href="@{/professor/assgn_random(thesisId=${thesis.id})}" class="btn-action">
            Random Selection
        </a>
    </div>

</div>

</body>
</html>
